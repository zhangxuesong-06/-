<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apx-console-token" content="__APX_TOKEN__">
<title>apx2 · 本地模型网关</title>
<style>
:root{
  --bg:#0b0c0e; --panel:#14161a; --panel2:#191c21; --line:#24282f;
  --text:#e6e8eb; --dim:#8b929e; --green:#7ee787; --amber:#f0b429; --red:#ff7b72; --blue:#79c0ff; --violet:#d2a8ff;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.55 ui-sans-serif,system-ui,"Segoe UI","Microsoft YaHei",sans-serif}
code,.mono{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace}
header{position:sticky;top:0;z-index:20;background:rgba(11,12,14,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.wrap{max-width:1240px;margin:0 auto;padding:0 22px}
.bar{display:flex;align-items:center;gap:12px;min-height:60px;flex-wrap:wrap}
.logo{font-weight:750;letter-spacing:.5px;font-size:16px}
.logo span{color:var(--green)}
.pill{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 10px;color:var(--dim);font-size:12px;white-space:nowrap}
.pill.live{color:var(--green);border-color:#2f5d3a;background:#102018;animation:breathe 1.6s ease-in-out infinite}
.grow{flex:1}
button{cursor:pointer;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:13px;transition:.15s}
button:hover{border-color:#3a4048;background:var(--panel2)}
button:disabled{opacity:.5;cursor:default}
button.primary{border-color:#2f5d3a;background:#13251a;color:var(--green)}
button.danger{border-color:#5d2f2f;color:var(--red)}
button.mini{padding:2px 8px;font-size:11.5px;border-radius:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:20px 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat .k{color:var(--dim);font-size:11.5px;text-transform:uppercase;letter-spacing:.09em}
.stat .v{font-size:25px;font-weight:650;margin-top:3px}
.stat .sub{color:var(--dim);font-size:12px;margin-top:2px}
h2{font-size:12.5px;text-transform:uppercase;letter-spacing:.11em;color:var(--dim);margin:26px 0 10px;display:flex;align-items:center;gap:10px}
h2 .grow{flex:1}
.endpoint{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:18px 0 4px}
.codebox{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 10px;max-width:100%}
.codebox code{color:var(--blue);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:62vw}
/* live flow */
.flow-panel{background:linear-gradient(180deg,#12151a,#0f1114);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-top:6px;position:relative;overflow:hidden}
.flow-head{display:flex;align-items:center;gap:10px;margin-bottom:16px;font-size:12.5px;color:var(--dim)}
.flow{display:flex;align-items:center;gap:10px}
.flow-node{display:flex;align-items:center;gap:9px;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 12px;font-size:13px;min-width:130px;text-align:left}
.picon{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;flex:none}
.picon svg{width:18px;height:18px;display:block}
.picon img{width:18px;height:18px;border-radius:4px;display:block}
.i-ollama{color:#f2f4f7}
.i-openai{color:#10a37f}
.i-tencent{color:#4aa8ff}
.i-deepseek{color:#4d6bfe}
.i-anthropic{color:#d4a27f}
.i-zcode{color:#f0b429}
.i-cube{color:#8b929e}
.i-client{color:#d2a8ff}
.flabel{display:flex;flex-direction:column;line-height:1.3;min-width:0}
.flabel b{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:250px}
.flabel small{color:var(--dim);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:250px}
.flow-node.core .flabel b{color:var(--green)}
.flow-node.client .flabel b{color:var(--violet)}
.flow-node.provider .flabel b{color:var(--blue)}
.flow-node.core{border-color:#2f5d3a;background:#102018;color:var(--green);font-weight:700;letter-spacing:.4px}
.flow-node.client{color:var(--violet);border-color:#3a2f56}
.flow-node.provider{color:var(--blue);border-color:#24384f;max-width:340px;overflow:hidden;text-overflow:ellipsis}
.flow-node.provider.hit{animation:nodeHit .9s ease-out}
.flow-link{flex:1;min-width:46px;height:2px;background:var(--line);position:relative;overflow:visible}
.flow-link .spark{position:absolute;top:-2px;left:-26px;width:26px;height:6px;border-radius:6px;background:linear-gradient(90deg,transparent,var(--green));opacity:0}
.flow.pulse .spark{animation:spark .9s ease-out}
.flow.flowing .spark{opacity:.9;animation:spark 1.4s linear infinite}
/* topology */
.route-row{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.route-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.route-head b{font-size:13.5px}
.strategy{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:5px;padding:0 6px}
.route-chain{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.route-node{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:12.5px;position:relative}
.route-node b{font-weight:600}
.hitbadge{position:absolute;top:-8px;right:-7px;background:var(--green);color:#08130b;font-size:9px;font-weight:750;border-radius:5px;padding:0 4px;line-height:14px}
.route-node.hit{animation:nodeHit .9s ease-out}
.route-node.off{opacity:.5}
.wire{flex:1;min-width:28px;height:1px;background:repeating-linear-gradient(90deg,var(--line) 0 6px,transparent 6px 10px);position:relative}
.wire::after{content:"";position:absolute;top:-1.5px;left:0;width:9px;height:4px;border-radius:4px;background:var(--green);opacity:0}
.route-chain.flowing .wire::after{opacity:.9;animation:travel 1.1s linear infinite}
/* providers */
.providers{display:grid;grid-template-columns:repeat(auto-fit,minmax(350px,1fr));gap:12px}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;position:relative;transition:.2s}
.pcard.off{opacity:.58}
.pcard.hit{animation:nodeHit .9s ease-out}
.phead{display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim);box-shadow:0 0 0 3px rgba(255,255,255,.03);flex:none}
.dot.ok{background:var(--green)} .dot.bad{background:var(--red)} .dot.idle{background:var(--amber)} .dot.off{background:#555}
.pname{font-weight:650}
.ptype{margin-left:auto;font-size:10.5px;color:var(--dim);border:1px solid var(--line);border-radius:5px;padding:1px 5px;white-space:nowrap}
.purl{color:var(--dim);font-size:11.5px;margin:6px 0 3px;word-break:break-all}
.pmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:11.5px;color:#c9cfd8}
.chip.more{color:var(--dim)}
.tag{font-size:10.5px;border-radius:5px;padding:1px 6px;border:1px solid var(--line);color:var(--dim)}
.tag.yes{color:var(--green);border-color:#2f5d3a;background:#102018}
.tag.no{color:var(--red);border-color:#5d2f2f;background:#2b1717}
.pactions{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.note{margin-top:8px;color:var(--dim);font-size:11.5px}
/* switch */
.switch{margin-left:auto;position:relative;width:36px;height:20px;flex:none}
.switch input{display:none}
.switch span{position:absolute;inset:0;border-radius:20px;background:#2a2e35;border:1px solid var(--line);transition:.2s;cursor:pointer}
.switch span::after{content:"";position:absolute;width:14px;height:14px;border-radius:50%;background:#9aa1ad;top:2px;left:2px;transition:.2s}
.switch input:checked + span{background:#173322;border-color:#2f5d3a}
.switch input:checked + span::after{left:18px;background:var(--green)}
/* tables */
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);font-size:12.5px;vertical-align:top}
th{color:var(--dim);font-weight:500;background:#121418}
tr:last-child td{border-bottom:none}
tr.row-in{animation:rowIn .5s ease-out}
.ok{color:var(--green)} .bad{color:var(--red)} .warn{color:var(--amber)} .dim{color:var(--dim)}
.findings{margin-top:8px;display:grid;gap:8px}
.finding{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100}
.modal.hidden{display:none}
.modal-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:min(760px,100%);max-height:88vh;overflow:auto;padding:20px 22px;box-shadow:0 25px 70px rgba(0,0,0,.6)}
.modal-card h3{margin:0 0 16px;font-size:17px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.field{margin-bottom:12px}
.field label{display:block;font-size:11.5px;color:var(--dim);margin-bottom:5px}
.field.row{display:flex;gap:18px;align-items:center}
label.check{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text)}
input,select,textarea{width:100%;background:#0e1013;border:1px solid var(--line);border-radius:8px;color:var(--text);padding:8px 10px;font:inherit;outline:none}
input:focus,select:focus,textarea:focus{border-color:#3a4048}
textarea{resize:vertical;font-family:ui-monospace,Consolas,monospace;font-size:12px}
input[readonly]{color:var(--dim)}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.model-list{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:8px;margin:10px 0;padding:6px}
.model-row{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:6px;font-size:12.5px}
.model-row:hover{background:var(--panel2)}
.model-row input{width:auto}
.model-row .grow{flex:1}
.model-row .switch{margin-left:0}
.model-row .flabel{flex:1}
/* toast */
.toast{position:fixed;right:20px;bottom:20px;z-index:200;max-width:min(560px,84vw);background:#12251a;border:1px solid #2f5d3a;color:var(--green);border-radius:10px;padding:10px 14px;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.45);opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .18s,transform .18s}
.toast.show{opacity:1;transform:none}
.toast.err{background:#2b1717;border-color:#5d2f2f;color:var(--red)}
footer{color:var(--dim);font-size:12px;padding:30px 0}
@keyframes spark{0%{left:-26px;opacity:0}15%{opacity:1}100%{left:100%;opacity:0}}
@keyframes travel{0%{left:0;opacity:0}15%{opacity:1}100%{left:calc(100% - 9px);opacity:0}}
@keyframes nodeHit{0%{box-shadow:0 0 0 0 rgba(126,231,135,.55)}100%{box-shadow:0 0 0 14px rgba(126,231,135,0)}}
@keyframes rowIn{from{background:#173322}to{background:transparent}}
@keyframes breathe{0%,100%{opacity:.75}50%{opacity:1}}
@media (max-width:720px){.grid2{grid-template-columns:1fr}.codebox code{max-width:48vw}}
</style>
</head>
<body>
<header><div class="wrap bar">
  <div class="logo">apx<span>2</span></div>
  <div class="pill" id="ver">v2</div>
  <div class="pill" id="uptime">—</div>
  <div class="pill" id="live">空闲</div>
  <div class="grow"></div>
  <button class="primary" onclick="openProvider()">+ 添加供应商</button>
  <button id="btn-scan" onclick="scan()">扫描本机</button>
  <button id="btn-reload" onclick="reload()">重载配置</button>
</div></header>

<main class="wrap">
  <div class="endpoint">
    <div class="codebox"><span class="dim">端点</span><code id="endpoint">http://127.0.0.1:8787/v1</code><button onclick="copy('endpoint')">复制</button></div>
    <div class="codebox"><span class="dim">Key</span><code id="token">__APX_TOKEN__</code><button onclick="copy('token')">复制</button></div>
  </div>

  <div class="grid">
    <div class="card stat"><div class="k">请求</div><div class="v" id="s-req">0</div></div>
    <div class="card stat"><div class="k">错误</div><div class="v" id="s-err">0</div></div>
    <div class="card stat"><div class="k">Tokens</div><div class="v" id="s-tok">0</div></div>
    <div class="card stat"><div class="k">可用模型</div><div class="v" id="s-models">0</div></div>
    <div class="card stat"><div class="k">供应商</div><div class="v" id="s-providers">0</div></div>
  </div>

  <div class="flow-panel">
    <div class="flow-head"><span>实时流量</span><span id="flow-group" class="tag" style="display:none"></span><span class="grow"></span><span id="flow-last" class="dim">还没有请求</span></div>
    <div class="flow" id="flow">
      <div class="flow-node client" id="flow-client"><span class="picon i-cube"></span><span class="flabel"><b>下游</b><small>等待请求</small></span></div>
      <div class="flow-link"><span class="spark"></span></div>
      <div class="flow-node core"><span class="picon" style="color:var(--green)">◆</span><span class="flabel"><b>apx2</b><small>route · failover</small></span></div>
      <div class="flow-link"><span class="spark"></span></div>
      <div class="flow-node provider" id="flow-provider"><span class="picon i-cube"></span><span class="flabel"><b>等待请求</b><small>—</small></span></div>
    </div>
  </div>

  <h2>路由拓扑 <span class="grow"></span><button class="mini" onclick="editGroup()">+ 新建路由组</button></h2>
  <div id="topology"></div>

  <h2>供应商 <span class="grow"></span><button class="mini" onclick="openProvider()">+ 添加</button></h2>
  <div class="providers" id="providers"></div>

  <h2>最近请求</h2>
  <table><thead><tr><th>时间</th><th>下游</th><th>模型</th><th>命中</th><th>状态</th><th>耗时</th><th>Tokens</th><th>说明</th></tr></thead>
  <tbody id="recent"></tbody></table>

  <h2>本机 harness 扫描</h2>
  <div class="dim" style="font-size:12.5px">只读取公开配置/明文凭据；不decrypt加密存储，不读取 magpie 的凭据，也不依赖 3425。</div>
  <div class="findings" id="findings"></div>

  <footer>apx2 · 本地 OpenAI 兼容网关 · 单二进制 · 不依赖 magpie</footer>
</main>

<div id="modal" class="modal hidden" onclick="if(event.target===this)closeModal()"><div class="modal-card" id="modal-card"></div></div>
<div id="toast" class="toast"></div>

function iconWrap(cls, svg, title){
  return '<span class="picon ' + cls + '" title="' + esc(title || '') + '">' + svg + '</span>';
}
function providerIcon(id){
  const k = String(id || '').toLowerCase();
  if (k.includes('ollama')) return iconWrap('i-ollama', '<svg viewBox="0 0 24 24" fill="currentColor"><path d="' + LOGO.ollama + '"/></svg>', 'Ollama');
  if (k.includes('codex') || k.includes('openai') || k.includes('gpt')) return iconWrap('i-openai', '<svg viewBox="0 0 24 24" fill="currentColor"><path d="' + LOGO.openai + '"/></svg>', 'OpenAI');
  if (k.includes('workbuddy') || k.includes('codebuddy')) return iconWrap('i-workbuddy', '<img src="/assets/workbuddy.png" alt="WorkBuddy">', 'WorkBuddy');
  if (k.includes('deepseek')) return iconWrap('i-deepseek', '<svg viewBox="0 0 24 24" fill="currentColor"><path d="' + LOGO.deepseek + '"/></svg>', 'DeepSeek');
  if (k.includes('anthropic') || k.includes('claude')) return iconWrap('i-anthropic', '<svg viewBox="0 0 24 24" fill="currentColor"><path d="' + LOGO.anthropic + '"/></svg>', 'Anthropic');
  if (k.includes('zcode') || k.includes('z.ai') || k.includes('zai')) return iconWrap('i-zcode', ZCODE_SVG, 'Zcode');
  return iconWrap('i-cube', CUBE_SVG, id || '未知');
}
function clientIcon(name){
  const k = String(name || '').toLowerCase();
  if (k.includes('coopanion')) return iconWrap('i-client', PAW_SVG, 'Coopanion');
  return iconWrap('i-cube', CUBE_SVG, name || '未知客户端');
}
let S = null;
let lastReqKey = '';
let modelDraft = [];
let modelsProvider = null;
let acctModelDraft = [];
let acctModelPid = '';
let acctModelAid = '';
let groupDraft = null;
let scanFindings = [];
let providerExtra = { file: '', env: '', jsonPath: '', paths: null };
let toastTimer;

function toast(msg, isErr){
  const el = $('toast');
  el.textContent = msg;
  el.className = 'toast show' + (isErr ? ' err' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = 'toast' + (isErr ? ' err' : ''); }, 3800);
}

async function api(path, opts = {}){
  const headers = Object.assign({}, opts.headers || {});
  headers['Authorization'] = 'Bearer ' + TOKEN;
  if (opts.body) headers['Content-Type'] = 'application/json';
  const r = await fetch(path, { ...opts, headers, cache: 'no-store' });
  const text = await r.text();
  let data = null;
  try { data = JSON.parse(text); } catch (e) {}
  if (!r.ok) throw new Error((data && data.error && data.error.message) || ('HTTP ' + r.status));
  return data;
}

function fmtTime(s){ try { return new Date(s).toLocaleTimeString(); } catch (e) { return s; } }

async function copy(id){
  const text = $(id).textContent.trim();
  let ok = false;
  try {
    ok = await Promise.race([
      navigator.clipboard.writeText(text).then(() => true).catch(() => false),
      new Promise(r => setTimeout(() => r(false), 1200)),
    ]);
  } catch (e) { ok = false; }
  if (!ok) {
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.left = '-9999px';
      document.body.appendChild(ta); ta.select();
      ok = document.execCommand('copy'); document.body.removeChild(ta);
    } catch (_) { ok = false; }
  }
  toast(ok ? '已复制到剪贴板' : '复制失败，请手动选中', !ok);
}

async function refresh(){
  try {
    const s = await api('/api/status');
    S = s;
    const recent = s.recent || [];
    const last = recent[recent.length - 1];
    const key = last ? [last.at, last.client, last.model, last.provider, last.account, last.status, last.ms].join('|') : '';
    const isNew = !!key && key !== lastReqKey;
    if (key) lastReqKey = key;
    $('ver').textContent = 'v' + (s.version || '2');
    $('uptime').textContent = s.uptime || '—';
    $('endpoint').textContent = s.baseURL || '';
    $('s-req').textContent = s.requests || 0;
    $('s-err').textContent = s.errors || 0;
    $('s-tok').textContent = (s.tokens || 0).toLocaleString();
    $('s-models').textContent = (s.models || []).length;
    $('s-providers').textContent = (s.providers || []).length;
    const c = s.concurrency || {};
    $('live').textContent = (c.active || 0) > 0
      ? '处理中 ' + c.active + '/' + (c.limit || 0) + (c.queued ? ' · 排队 ' + c.queued : '')
      : '空闲 ' + (c.limit || 0) + ' 并发';
    $('live').className = 'pill' + ((c.active || 0) > 0 ? ' live' : '');
    renderFlow(s, last, isNew);
    renderTopology(s, isNew);
    renderProviders(s, last, isNew);
    renderRecent(s, isNew);
  } catch (e) {
    $('uptime').textContent = '连接断开';
    $('live').textContent = '离线';
    $('live').className = 'pill';
  }
}

function renderFlow(s, last, isNew){
  const flow = $('flow');
  const byId = {};
  (s.providers || []).forEach(p => byId[p.id] = p);
  if (last) {
    const p = byId[last.provider] || {};
    const pname = p.name || last.provider || '未知';
    const acct = last.account || (p.account && p.account.label) || '本地';
    const client = last.client || '客户端';
    $('flow-client').innerHTML = clientIcon(client) + '<span class="flabel"><b>' + esc(client) + '</b><small>下游</small></span>';
    $('flow-provider').innerHTML = providerIcon(last.provider) + '<span class="flabel"><b>' + esc(pname) + '</b><small>' + esc(acct) + ' · ' + esc(last.model || '') + '</small></span>';
    $('flow-group').textContent = last.group ? ('via ' + last.group) : '直连';
    $('flow-group').style.display = '';
    $('flow-last').textContent = (last.status || '') + ' · ' + (last.ms || 0) + 'ms · ' + (last.tokens || 0) + ' tok · ' + fmtTime(last.at);
    if (isNew) {
      flow.classList.remove('pulse');
      void flow.offsetWidth;
      flow.classList.add('pulse');
      $('flow-provider').classList.add('hit');
      setTimeout(() => $('flow-provider').classList.remove('hit'), 950);
    }
  } else {
    $('flow-client').innerHTML = '<span class="picon i-cube"></span><span class="flabel"><b>下游</b><small>等待请求</small></span>';
    $('flow-provider').innerHTML = '<span class="picon i-cube"></span><span class="flabel"><b>等待请求</b><small>—</small></span>';
    $('flow-group').style.display = 'none';
    $('flow-last').textContent = '还没有请求';
  }
  const active = (s.concurrency || {}).active || 0;
  flow.classList.toggle('flowing', active > 0);
}

function routeNode(pid, p, aid, label, enabled, cls, anim, lastHit){
  return '<div class="route-node ' + cls + (anim ? ' hit' : '') + '" data-pid="' + esc(pid) + '" data-aid="' + esc(aid) + '">'
    + providerIcon(pid)
    + '<span class="flabel"><b>' + esc(p.name || pid) + '</b><small>' + esc(label) + ' · ' + enabled + ' 模型</small></span>'
    + (lastHit ? '<span class="hitbadge">命中</span>' : '') + '</div>';
}

function renderTopology(s, isNew){
  const byId = {};
  (s.providers || []).forEach(p => byId[p.id] = p);
  const last = (s.recent || [])[(s.recent || []).length - 1];
  $('topology').innerHTML = (s.groups || []).map(g => {
    const nodes = [];
    for (const pid of (g.providers || [])) {
      const p = byId[pid] || { id: pid, name: pid, models: [], accounts: [] };
      const enabled = (p.models || []).filter(m => !m.disabled).length;
      const accounts = (p.accounts || []).filter(a => !a.disabled);
      if ((p.accounts || []).length > 0 && accounts.length > 0) {
        for (const a of accounts) {
          const h = a.health || {};
          const cls = p.disabled ? 'off' : (h.ok === true ? 'ok' : (h.ok === false ? 'bad' : 'idle'));
          const lastHit = last && last.provider === pid && (last.accountId || '') === a.id;
          nodes.push(routeNode(pid, p, a.id, a.label, enabled, cls, isNew && lastHit, lastHit));
        }
      } else {
        const h = p.health || {};
        const cls = p.disabled ? 'off' : (h.ok === true ? 'ok' : (h.ok === false ? 'bad' : 'idle'));
        const lastHit = last && last.provider === pid && !last.accountId;
        const label = (p.accounts || []).length > 0 ? '无可用账号' : ((p.account && p.account.label) || '本地');
        nodes.push(routeNode(pid, p, '', label, enabled, cls, isNew && lastHit, lastHit));
      }
    }
    const chain = nodes.map((n, i) => (i ? '<span class="wire"></span>' : '') + n).join('');
    const routed = last && last.group === g.id ? '<span class="tag yes">→ ' + esc(last.provider || '') + (last.account ? ' · ' + esc(last.account) : '') + '</span>' : '';
    const gname = g.auto ? (g.name || ('同模型 · ' + (g.model || ''))) : g.id;
    const strat = g.auto ? ('自动 · ' + (g.strategy || 'order')) : (g.strategy || 'order');
    const editBtn = g.auto ? '' : '<button class="mini" onclick="editGroup(\'' + esc(g.id) + '\')">编辑</button>';
    return '<div class="route-row"><div class="route-head"><b>' + esc(gname) + '</b><span class="strategy">' + esc(strat) + '</span>' + routed + '<span class="grow"></span>' + editBtn + '</div>'
      + '<div class="route-chain' + (((s.concurrency || {}).active || 0) > 0 ? ' flowing' : '') + '">' + (chain || '<span class="dim">还没有成员</span>') + '</div></div>';
  }).join('') || '<div class="dim">还没有路由组。点「+ 新建路由组」把 provider 串起来。</div>';
}

function renderProviders(s, last, isNew){
  $('providers').innerHTML = (s.providers || []).map(p => {
    const models = p.models || [];
    const enabled = models.filter(m => !m.disabled);
    const chips = enabled.slice(0, 8).map(m => '<span class="chip">' + esc(m.id) + '</span>').join('')

    const h = p.health || {};

      : '<span class="tag ' + (p.keySet ? 'yes' : 'no') + '">' + (p.keySet ? 'Key 已配置' : '缺 Key') + '</span>';
    const acctCount = (p.accounts || []).length;
    const acctEnabled = (p.accounts || []).filter(a => !a.disabled).length;
    const acctText = acctCount ? (acctEnabled + '/' + acctCount + ' 账号') : ((p.account && p.account.label) || '本地');

    const hit = isNew && last && last.provider === p.id ? ' hit' : '';
    return '<div class="pcard' + (p.disabled ? ' off' : '') + hit + '" data-pid="' + esc(p.id) + '">'

      + '<span class="ptype">' + esc(p.protocol) + '</span>'
      + '<label class="switch" title="' + (p.disabled ? '恢复供应' : '停止供应') + '"><input type="checkbox" ' + (p.disabled ? '' : 'checked') + ' onchange="toggleProvider(\'' + esc(p.id) + '\',this.checked)"><span></span></label></div>'
      + '<div class="purl">' + esc(p.baseUrl) + '</div>'
      + (p.proxy ? '<div class="purl">proxy ' + esc(p.proxy) + '</div>' : '')
      + '<div class="pmeta">' + keyTag + '<span class="dim">' + esc(acctText) + '</span><span class="dim">' + enabled.length + '/' + models.length + ' 模型</span>'
      + (p.tlsMax ? '<span class="tag">TLS ' + esc(p.tlsMax) + '</span>' : '')
      + (h.lastLatencyMs ? '<span class="dim">' + h.lastLatencyMs + 'ms</span>' : '') + '</div>'
      + '<div class="chips">' + (chips || '<span class="dim">未选择模型</span>') + '</div>'
      + '<div class="pactions">'
      + '<button onclick="openModels(\'' + esc(p.id) + '\')">模型</button>'
      + '<button onclick="openAccounts(\'' + esc(p.id) + '\')">账号' + (acctCount ? ' (' + acctCount + ')' : '') + '</button>'
      + loginBtn
      + (hideKey ? '' : '<button onclick="openKey(\'' + esc(p.id) + '\')">设置 Key</button>')
      + '<button onclick="discover(\'' + esc(p.id) + '\')">发现模型</button>'
      + '<button onclick="testProvider(\'' + esc(p.id) + '\')">测试</button>'
      + '<button onclick="openProvider(\'' + esc(p.id) + '\')">编辑</button>'
      + '<button class="danger" onclick="removeProvider(\'' + esc(p.id) + '\')">删除</button>'
      + '</div>'
      + (p.notes ? '<div class="note">' + esc(p.notes) + '</div>' : '')
      + (h.lastError ? '<div class="note bad">' + esc(h.lastError) + '</div>' : '')
      + '</div>';
  }).join('') || '<div class="dim">还没有供应商，点右上角「+ 添加供应商」。</div>';
}

function renderRecent(s, isNew){
  $('recent').innerHTML = (s.recent || []).slice().reverse().map((r, i) => {
    const cls = r.status >= 400 ? 'bad' : 'ok';
    const hit = r.provider ? providerIcon(r.provider) + ' ' + esc(r.provider) + (r.account ? ' <span class="dim">' + esc(r.account) + '</span>' : '') + (r.group ? ' <span class="dim">via ' + esc(r.group) + '</span>' : '') : '<span class="dim">—</span>';
    const client = r.client ? (clientIcon(r.client) + ' ' + esc(r.client)) : '<span class="dim">—</span>';

      + '<td class="' + cls + '">' + r.status + '</td><td class="dim">' + (r.ms || 0) + 'ms</td><td class="dim">' + (r.tokens || 0) + '</td>'

}

/* ---------- modal ---------- */
function showModal(html){ $('modal-card').innerHTML = html; $('modal').classList.remove('hidden'); }
function closeModal(){ $('modal').classList.add('hidden'); $('modal-card').innerHTML = ''; }

function openProvider(id, preset){
  const p = preset || (id ? (S.providers || []).find(x => x.id === id) : null);
  const editing = !!id || !!preset;
  const auth = preset && preset.auth ? preset.auth.type : (p ? p.authType : 'bearer');
  const models = preset && preset.models
    ? preset.models.map(m => m.id).join('\n')
    : (p ? (p.models || []).filter(m => !m.disabled).map(m => m.id).join('\n') : '');
  providerExtra = {
    file: preset && preset.auth ? (preset.auth.file || '') : '',
    env: preset && preset.auth ? (preset.auth.env || '') : '',
    jsonPath: preset && preset.auth ? (preset.auth.jsonPath || '') : '',
    paths: preset ? (preset.paths || null) : null,
  };
  showModal(
    '<h3>' + (editing ? '编辑供应商' : '添加供应商') + '</h3>'
    + '<div class="grid2">'
    + '<div class="field"><label>ID</label><input id="f-id" value="' + esc(p ? p.id : '') + '" ' + (editing ? 'readonly' : '') + ' placeholder="myrelay"></div>'
    + '<div class="field"><label>名称</label><input id="f-name" value="' + esc(p ? p.name || '' : '') + '" placeholder="我的中转站"></div>'
    + '<div class="field"><label>协议</label><select id="f-protocol">' + options(['openai-chat', 'openai-responses', 'anthropic'], p ? p.protocol : 'openai-chat') + '</select></div>'
    + '<div class="field"><label>Base URL</label><input id="f-base" value="' + esc(p ? p.baseUrl || '' : '') + '" placeholder="https://.../v1"></div>'
    + '<div class="field"><label>认证方式</label><select id="f-auth">' + options(['none', 'bearer', 'workbuddy-key', 'zcode-key', 'zcode-config', 'codex-oauth', 'header', 'workbuddy-oauth', 'zcode-oauth'], auth) + '</select></div>'
    + '<div class="field"><label>API Key ' + (editing ? '（留空不修改）' : '') + '</label><input id="f-key" type="password" placeholder="sk-..."></div>'
    + '<div class="field"><label>代理（可选）</label><input id="f-proxy" value="' + esc(p ? p.proxy || '' : '') + '" placeholder="http://127.0.0.1:7901"></div>'
    + '<div class="field"><label>TLS 上限</label><select id="f-tls">' + options(['', '1.2'], p ? p.tlsMax || '' : '') + '</select></div>'
    + '</div>'
    + '<div class="field"><label>供应该模型（每行一个）</label><textarea id="f-models" rows="5" placeholder="gpt-6.1-sol&#10;gpt-5.6-sol">' + esc(models) + '</textarea></div>'
    + '<div class="field row"><label class="check"><input type="checkbox" id="f-discover" ' + (p && p.discover ? 'checked' : '') + '> 自动发现模型</label>'
    + '<label class="check"><input type="checkbox" id="f-disabled" ' + (p && p.disabled ? 'checked' : '') + '> 停止供应</label></div>'
    + '<div class="field"><label>备注</label><input id="f-notes" value="' + esc(p ? p.notes || '' : '') + '"></div>'
    + '<div class="modal-actions"><button onclick="closeModal()">取消</button><button class="primary" onclick="saveProvider(' + editing + ')">保存</button></div>'
  );
}

async function saveProvider(editing){
  const id = $('f-id').value.trim();
  if (!/^[a-z0-9][a-z0-9_-]*$/.test(id)) { toast('ID 只能用小写字母、数字、- 和 _', true); return; }
  const baseUrl = $('f-base').value.trim();
  if (!baseUrl) { toast('Base URL 不能为空', true); return; }
  const models = $('f-models').value.split('\n').map(s => s.trim()).filter(s => s && !s.startsWith('#'));
  const body = {
    id: id,
    name: $('f-name').value.trim(),
    protocol: $('f-protocol').value,
    baseUrl: baseUrl,
    authType: $('f-auth').value,
    proxy: $('f-proxy').value.trim(),
    tlsMax: $('f-tls').value,
    notes: $('f-notes').value.trim(),
    models: models,
    discover: $('f-discover').checked,
    disabled: $('f-disabled').checked,
  };
  const key = $('f-key').value.trim();
  if (key) body.apiKey = key;
  if (providerExtra.file) body.file = providerExtra.file;
  if (providerExtra.env) body.env = providerExtra.env;
  if (providerExtra.jsonPath) body.jsonPath = providerExtra.jsonPath;
  if (providerExtra.paths) body.paths = providerExtra.paths;
  try {
    await api('/api/providers', { method: 'POST', body: JSON.stringify(body) });
    closeModal();
    toast('已保存供应商 ' + id);
    if (body.discover) { try { await discover(id, true); } catch (e) { toast('已保存，但发现模型失败：' + e.message, true); } }
    await refresh();
  } catch (e) { toast('保存失败：' + e.message, true); }
}

async function toggleProvider(id, enabled){
  try {
    await api('/api/providers/' + encodeURIComponent(id), { method: 'PATCH', body: JSON.stringify({ disabled: !enabled }) });
    toast(enabled ? '已恢复供应：' + id : '已停止供应：' + id);
    await refresh();
  } catch (e) { toast('操作失败：' + e.message, true); await refresh(); }
}

async function removeProvider(id){
  if (!confirm('删除供应商 ' + id + '？相关路由组里的引用也会移除。')) return;
  try {
    await api('/api/providers/' + encodeURIComponent(id), { method: 'DELETE' });
    toast('已删除 ' + id);
    await refresh();
  } catch (e) { toast('删除失败：' + e.message, true); }
}

function openKey(id){
  const p = (S.providers || []).find(x => x.id === id);
  showModal('<h3>设置 API Key · ' + esc(p ? p.name || id : id) + '</h3>'
    + '<div class="field"><label>API Key</label><input id="k-key" type="password" placeholder="sk-..."></div>'
    + '<div class="dim" style="font-size:12px">Key 写到 apx 自己的 ~/.apx2/credentials.json，不会写进 providers.json。当前认证：' + esc(p ? p.authType : '') + '</div>'
    + '<div class="modal-actions"><button onclick="closeModal()">取消</button><button class="primary" onclick="saveKey(\'' + esc(id) + '\')">保存</button></div>');
  setTimeout(() => $('k-key') && $('k-key').focus(), 30);
}

async function saveKey(id){
  const key = $('k-key').value.trim();
  if (!key) { toast('Key 不能为空', true); return; }
  try {
    await api('/api/providers/' + encodeURIComponent(id) + '/key', { method: 'POST', body: JSON.stringify({ apiKey: key }) });
    closeModal();
    toast('Key 已保存：' + id);
    await refresh();
  } catch (e) { toast('保存失败：' + e.message, true); }
}

/* ---------- models ---------- */
function openModels(id){
  const p = (S.providers || []).find(x => x.id === id);
  if (!p) return;
  modelsProvider = id;
  modelDraft = (p.models || []).map(m => ({ id: m.id, checked: !m.disabled }));
  showModal('<h3>模型 · ' + esc(p.name || id) + '</h3>'
    + '<div class="field row"><input id="m-search" placeholder="搜索模型" oninput="renderModelList()" style="flex:1">'
    + '<button class="mini" onclick="modelCheckAll(true)">全选</button><button class="mini" onclick="modelCheckAll(false)">清空</button>'
    + '<button class="mini" onclick="discoverModelsInModal()">发现模型</button></div>'
    + '<div id="m-list" class="model-list"></div>'
    + '<div class="field row"><input id="m-new" placeholder="手动添加模型 ID" style="flex:1"><button class="mini" onclick="modelAdd()">添加</button></div>'
    + '<div class="modal-actions"><button onclick="closeModal()">取消</button><button class="primary" onclick="saveModels()">保存选择</button></div>');
  renderModelList();
}

function renderModelList(){
  const q = ($('m-search') ? $('m-search').value : '').toLowerCase();
  const rows = modelDraft.filter(m => m.id.toLowerCase().includes(q)).map(m =>
    '<label class="model-row"><input type="checkbox" ' + (m.checked ? 'checked' : '') + ' onchange="modelToggle(\'' + esc(m.id) + '\',this.checked)"><span>' + esc(m.id) + '</span></label>'
  ).join('');
  $('m-list').innerHTML = rows || '<div class="dim" style="padding:8px">没有模型。点「发现模型」或手动添加。</div>';
}

function modelToggle(id, checked){
  const m = modelDraft.find(x => x.id === id);
  if (m) m.checked = checked;
}
function modelCheckAll(checked){ modelDraft.forEach(m => m.checked = checked); renderModelList(); }
function modelAdd(){
  const id = $('m-new').value.trim();
  if (!id) return;
  if (!modelDraft.some(m => m.id === id)) modelDraft.push({ id: id, checked: true });
  $('m-new').value = '';
  renderModelList();
}

async function discoverModelsInModal(){
  if (!modelsProvider) return;
  try {
    const d = await api('/api/providers/' + encodeURIComponent(modelsProvider) + '/discover', { method: 'POST' });
    modelDraft = (d.models || []).map(m => ({ id: m.id, checked: !m.disabled }));
    renderModelList();
    toast('发现 ' + (d.count || modelDraft.length) + ' 个模型');
    await refresh();
  } catch (e) { toast('发现失败：' + e.message, true); }
}

async function saveModels(){
  if (!modelsProvider) return;
  const enabled = modelDraft.filter(m => m.checked).map(m => m.id);
  try {
    await api('/api/providers/' + encodeURIComponent(modelsProvider), { method: 'PATCH', body: JSON.stringify({ enabledModels: enabled }) });
    closeModal();
    toast('已更新供应模型：' + modelsProvider + '（' + enabled.length + ' 个）');
    await refresh();
  } catch (e) { toast('保存失败：' + e.message, true); }
}

/* ---------- groups ---------- */
function editGroup(id){
  const g = id ? (S.groups || []).find(x => x.id === id) : null;
  if (g && g.auto) { toast('自动组随模型自动生成，不可编辑', true); return; }
  groupDraft = { id: g ? g.id : '', name: g ? g.name || '' : '', strategy: g ? g.strategy || 'order' : 'order', providers: g ? (g.providers || []).slice() : [] };
  renderGroupModal();
}

function syncGroupDraft(){
  if ($('g-id')) groupDraft.id = $('g-id').value.trim();
  if ($('g-name')) groupDraft.name = $('g-name').value;
  if ($('g-strategy')) groupDraft.strategy = $('g-strategy').value;
}

function renderGroupModal(){
  const all = (S.providers || []).map(p => p.id);
  const chosen = groupDraft.providers.map((pid, i) =>
    '<div class="model-row"><input type="checkbox" checked onchange="groupToggle(\'' + esc(pid) + '\',this.checked)"><span>' + esc(pid) + '</span><span class="grow"></span>'
    + '<button class="mini" onclick="groupMove(' + i + ',-1)">↑</button><button class="mini" onclick="groupMove(' + i + ',1)">↓</button></div>'
  ).join('');
  const rest = all.filter(id => !groupDraft.providers.includes(id)).map(id =>
    '<label class="model-row"><input type="checkbox" onchange="groupToggle(\'' + esc(id) + '\',this.checked)"><span>' + esc(id) + '</span></label>'
  ).join('');
  showModal('<h3>' + (groupDraft.id ? '编辑路由组' : '新建路由组') + '</h3>'
    + '<div class="grid2"><div class="field"><label>ID</label><input id="g-id" value="' + esc(groupDraft.id) + '" ' + (groupDraft.id ? 'readonly' : '') + ' placeholder="auto"></div>'
    + '<div class="field"><label>名称</label><input id="g-name" value="' + esc(groupDraft.name) + '" placeholder="自动路由"></div>'
    + '<div class="field"><label>策略</label><select id="g-strategy">' + options(['order', 'rotate', 'usage'], groupDraft.strategy) + '</select></div></div>'
    + '<div class="field"><label>成员（按顺序尝试）</label>' + (chosen || '<div class="dim">还没有成员</div>')
    + (rest ? '<div class="dim" style="margin:10px 0 4px">可加入</div>' + rest : '') + '</div>'
    + '<div class="modal-actions">' + (groupDraft.id ? '<button class="danger" onclick="deleteGroup()">删除路由组</button>' : '')
    + '<button onclick="closeModal()">取消</button><button class="primary" onclick="saveGroup()">保存</button></div>');
}

function groupToggle(id, checked){
  syncGroupDraft();
  if (checked) {
    if (!groupDraft.providers.includes(id)) groupDraft.providers.push(id);
  } else {
    groupDraft.providers = groupDraft.providers.filter(x => x !== id);
  }
  renderGroupModal();
}

function groupMove(i, dir){
  syncGroupDraft();
  const j = i + dir;
  if (j < 0 || j >= groupDraft.providers.length) return;
  const t = groupDraft.providers[i];
  groupDraft.providers[i] = groupDraft.providers[j];
  groupDraft.providers[j] = t;
  renderGroupModal();
}

async function saveGroup(){
  syncGroupDraft();
  const id = ($('g-id').value || '').trim();
  if (!/^[a-z0-9][a-z0-9_-]*$/.test(id)) { toast('路由组 ID 不合法', true); return; }
  if (groupDraft.providers.length === 0) { toast('至少选一个 provider', true); return; }
  try {
    await api('/api/groups', { method: 'POST', body: JSON.stringify({ id: id, name: groupDraft.name, strategy: groupDraft.strategy, providers: groupDraft.providers }) });
    closeModal();
    toast('已保存路由组 ' + id);
    await refresh();
  } catch (e) { toast('保存失败：' + e.message, true); }
}

async function deleteGroup(){
  if (!groupDraft || !groupDraft.id) return;
  if (!confirm('删除路由组 ' + groupDraft.id + '？')) return;
  try {
    await api('/api/groups/' + encodeURIComponent(groupDraft.id), { method: 'DELETE' });
    closeModal();
    toast('已删除路由组 ' + groupDraft.id);
    await refresh();
  } catch (e) { toast('删除失败：' + e.message, true); }
}

/* ---------- accounts ---------- */
function openAccounts(id){
  const p = (S.providers || []).find(x => x.id === id);
  if (!p) return;
  const accts = p.accounts || [];
  const rows = accts.map(a => {
    const h = a.health || {};

    const scope = (a.models && a.models.length) ? (a.models.length + ' 个模型') : '全部模型';
    return '<div class="model-row">'
      + '<label class="switch"><input type="checkbox" ' + (a.disabled ? '' : 'checked') + ' onchange="accountToggle(\'' + esc(id) + '\',\'' + esc(a.id) + '\',this.checked)"><span></span></label>'
      + '<span class="flabel"><b>' + esc(a.name || a.id) + '</b><small>' + esc(a.label || '') + ' · ' + (a.keySet ? 'Key 已配置' : '缺 Key') + ' · ' + esc(scope) + '</small></span>'
      + '<i class="dot ' + cls + '"></i>'
      + '<button class="mini" onclick="openAccountModels(\'' + esc(id) + '\',\'' + esc(a.id) + '\')">模型</button>'
      + '<button class="mini" onclick="openAccountKey(\'' + esc(id) + '\',\'' + esc(a.id) + '\')">Key</button>'
      + '<button class="mini danger" onclick="deleteAccount(\'' + esc(id) + '\',\'' + esc(a.id) + '\')">删除</button>'
      + '</div>';

  showModal('<h3>账号池 · ' + esc(p.name || id) + '</h3>'
    + '<div class="dim" style="font-size:12px;margin-bottom:10px">配置账号后，这个 provider 只使用启用的账号参与路由；未配置账号时使用默认凭据。账号 Key 存在 <code>~/.apx2/credentials.json</code>。</div>'
    + (rows || '<div class="model-row"><span class="flabel"><b>默认凭据</b><small>' + esc((p.account && p.account.label) || '本地') + '</small></span></div>')
    + '<div class="dim" style="margin:14px 0 4px">添加账号</div>'
    + '<div class="grid2"><div class="field"><label>账号 ID</label><input id="a-id" placeholder="a1"></div>'
    + '<div class="field"><label>名称（可选）</label><input id="a-name" placeholder="主号"></div></div>'
    + '<div class="field"><label>API Key</label><input id="a-key" type="password" placeholder="sk-..."></div>'
    + '<div class="field"><label>凭据文件（可选，Codex OAuth 多账号用）</label><input id="a-file" placeholder="~/.codex/account2.json"></div>'
    + '<div class="modal-actions"><button onclick="closeModal()">关闭</button><button class="primary" onclick="addAccount(\'' + esc(id) + '\')">添加账号</button></div>');
}

function openAccountModels(pid, aid){
  const p = (S.providers || []).find(x => x.id === pid);
  const a = p && (p.accounts || []).find(x => x.id === aid);
  if (!p || !a) return;
  acctModelPid = pid;
  acctModelAid = aid;
  const models = (p.models || []).filter(m => !m.disabled);
  const allowed = a.models || [];
  acctModelDraft = models.map(m => ({ id: m.id, checked: allowed.length ? allowed.includes(m.id) : true }));
  showModal('<h3>账号模型 · ' + esc(pid) + '#' + esc(aid) + '</h3>'
    + '<div class="dim" style="font-size:12px;margin-bottom:10px">只允许这个账号使用勾选的模型；全部勾选等于不限制。至少留一个，或直接停用账号。</div>'
    + '<div class="field row"><input id="am-search" placeholder="搜索模型" oninput="renderAcctModelList()" style="flex:1"><button class="mini" onclick="acctModelAll(true)">全选</button><button class="mini" onclick="acctModelAll(false)">清空</button></div>'
    + '<div id="am-list" class="model-list"></div>'
    + '<div class="modal-actions"><button onclick="openAccounts(\'' + esc(pid) + '\')">返回</button><button class="primary" onclick="saveAcctModels()">保存</button></div>');
  renderAcctModelList();
}

function renderAcctModelList(){
  const q = ($('am-search') ? $('am-search').value : '').toLowerCase();
  const rows = acctModelDraft.filter(m => m.id.toLowerCase().includes(q)).map(m =>
    '<label class="model-row"><input type="checkbox" ' + (m.checked ? 'checked' : '') + ' onchange="acctModelToggle(\'' + esc(m.id) + '\',this.checked)"><span>' + esc(m.id) + '</span></label>'
  ).join('');
  $('am-list').innerHTML = rows || '<div class="dim" style="padding:8px">没有模型</div>';
}

function acctModelToggle(id, checked){
  const m = acctModelDraft.find(x => x.id === id);
  if (m) m.checked = checked;
}
function acctModelAll(checked){ acctModelDraft.forEach(m => m.checked = checked); renderAcctModelList(); }

async function saveAcctModels(){
  const checked = acctModelDraft.filter(m => m.checked).map(m => m.id);
  if (checked.length === 0) { toast('至少勾选一个模型，或停用这个账号', true); return; }
  const all = checked.length === acctModelDraft.length;
  try {
    await api('/api/providers/' + encodeURIComponent(acctModelPid) + '/accounts/' + encodeURIComponent(acctModelAid), {
      method: 'PATCH', body: JSON.stringify({ models: all ? [] : checked }),
    });
    toast(all ? '账号使用全部模型' : ('账号已限制为 ' + checked.length + ' 个模型'));
    await refresh();
    openAccounts(acctModelPid);
  } catch (e) { toast('保存失败：' + e.message, true); }
}

async function accountToggle(pid, aid, enabled){
  try {
    await api('/api/providers/' + encodeURIComponent(pid) + '/accounts/' + encodeURIComponent(aid), {
      method: 'PATCH', body: JSON.stringify({ disabled: !enabled }),
    });
    toast((enabled ? '已启用账号 ' : '已停用账号 ') + aid);
    await refresh();
    openAccounts(pid);
  } catch (e) { toast('操作失败：' + e.message, true); await refresh(); }
}

async function addAccount(pid){
  const id = $('a-id').value.trim();
  if (!/^[a-z0-9][a-z0-9_-]*$/.test(id)) { toast('账号 ID 只能用小写字母、数字、- 和 _', true); return; }
  const key = $('a-key').value.trim();
  const file = $('a-file').value.trim();
  if (!key && !file) { toast('Key 或凭据文件至少填一个', true); return; }
  const body = { id: id, name: $('a-name').value.trim() };
  if (key) body.apiKey = key;
  if (file) body.file = file;
  try {
    await api('/api/providers/' + encodeURIComponent(pid) + '/accounts', { method: 'POST', body: JSON.stringify(body) });
    toast('已添加账号 ' + id);
    await refresh();
    openAccounts(pid);
  } catch (e) { toast('添加失败：' + e.message, true); }
}

function openAccountKey(pid, aid){
  showModal('<h3>账号 Key · ' + esc(pid) + '#' + esc(aid) + '</h3>'
    + '<div class="field"><label>API Key</label><input id="ak-key" type="password" placeholder="sk-..."></div>'
    + '<div class="modal-actions"><button onclick="openAccounts(\'' + esc(pid) + '\')">返回</button><button class="primary" onclick="saveAccountKey(\'' + esc(pid) + '\',\'' + esc(aid) + '\')">保存</button></div>');
  setTimeout(() => $('ak-key') && $('ak-key').focus(), 30);
}

async function saveAccountKey(pid, aid){
  const key = $('ak-key').value.trim();
  if (!key) { toast('Key 不能为空', true); return; }
  try {
    await api('/api/providers/' + encodeURIComponent(pid) + '/accounts/' + encodeURIComponent(aid), {
      method: 'PATCH', body: JSON.stringify({ apiKey: key }),
    });
    toast('账号 Key 已保存');
    await refresh();
    openAccounts(pid);
  } catch (e) { toast('保存失败：' + e.message, true); }
}

async function deleteAccount(pid, aid){
  if (!confirm('删除账号 ' + pid + '#' + aid + '？')) return;
  try {
    await api('/api/providers/' + encodeURIComponent(pid) + '/accounts/' + encodeURIComponent(aid), { method: 'DELETE' });
    toast('已删除账号 ' + aid);
    await refresh();
    openAccounts(pid);
  } catch (e) { toast('删除失败：' + e.message, true); }
}

/* ---------- WorkBuddy login ---------- */
async function loginWB(pid){
  try {
    await api('/api/providers/' + encodeURIComponent(pid) + '/login', { method: 'POST' });
    toast('已打开独立登录窗口（已绕过代理），请完成 WorkBuddy 登录…');
    pollWB(pid);
  } catch (e) { toast('登录启动失败：' + e.message, true); }
}

async function pollWB(pid){
  try {
    const s = await api('/api/providers/' + encodeURIComponent(pid) + '/login');
    if (s.status === 'success') {
      toast(s.message || ('WorkBuddy 登录成功：' + (s.account || '')));
      await refresh();
      return;
    }
    if (s.status === 'error') {
      toast('WorkBuddy 登录失败：' + (s.message || ''), true);
      return;
    }
    setTimeout(() => pollWB(pid), 2000);
  } catch (e) {
    setTimeout(() => pollWB(pid), 3000);
  }
}

/* ---------- provider actions ---------- */
async function discover(id, silent){
  try {
    const d = await api('/api/providers/' + encodeURIComponent(id) + '/discover', { method: 'POST' });
    if (!silent) toast('发现 ' + (d.count || 0) + ' 个模型：' + id);
    await refresh();
    return d;
  } catch (e) {
    if (!silent) toast('发现失败：' + e.message, true);
    throw e;
  }
}

async function testProvider(id){
  toast('正在测试 ' + id + '…');
  try {
    const d = await api('/api/providers/' + encodeURIComponent(id) + '/test', { method: 'POST' });
    toast(d.ok ? ('测试通过：' + id + ' · ' + d.latencyMs + 'ms · ' + d.models + ' 个模型') : ('测试失败：' + d.message), !d.ok);
  } catch (e) { toast('测试失败：' + e.message, true); }
}

/* ---------- scan / reload ---------- */
function renderFindings(s){
  scanFindings = s.findings || [];
  $('findings').innerHTML = scanFindings.map(f => {
    const tag = f.available ? '<span class="tag yes">可用</span>' : '<span class="tag no">缺凭据</span>';
    const healthy = f.healthy === undefined || f.healthy === null ? '' : (f.healthy ? ' <span class="tag yes">网络可达</span>' : ' <span class="tag no">网络不可达</span>');
    const add = f.provider ? '<button class="mini" onclick="addFromScan(\'' + esc(f.id) + '\')">添加为供应商</button>' : '';
    return '<div class="finding"><b>' + esc(f.name) + '</b>' + tag + healthy
      + '<div class="dim">' + esc(f.detail || '') + '</div>'
      + (f.models && f.models.length ? '<div class="chips" style="margin-top:6px">' + f.models.map(m => '<span class="chip">' + esc(m) + '</span>').join('') + '</div>' : '')
      + (f.note ? '<div class="note">' + esc(f.note) + '</div>' : '')
      + (add ? '<div class="pactions">' + add + '</div>' : '') + '</div>';
  }).join('') || '<div class="dim">没有发现。</div>';
}

function addFromScan(id){
  const f = scanFindings.find(x => x.id === id);
  if (!f || !f.provider) return;
  closeModal();
  openProvider(null, f.provider);
}

async function scan(){
  const btn = $('btn-scan');
  const old = btn.textContent;
  btn.disabled = true; btn.textContent = '扫描中…';
  $('findings').innerHTML = '<div class="dim">正在扫描…（网络探测可能需要几秒）</div>';
  toast('开始扫描本机 harness…');
  try {
    const s = await api('/api/scan');
    renderFindings(s);
    const list = s.findings || [];
    const usable = list.filter(f => f.available && f.healthy !== false).length;
    toast('扫描完成：' + list.length + ' 项，' + usable + ' 项可直接用');
    $('findings').scrollIntoView({ behavior: 'smooth', block: 'center' });
  } catch (e) {
    $('findings').innerHTML = '<div class="bad">扫描失败：' + esc(e.message) + '</div>';
    toast('扫描失败：' + e.message, true);
  } finally {
    btn.disabled = false; btn.textContent = old;
  }
}

async function reload(){
  const btn = $('btn-reload');
  const old = btn.textContent;
  btn.disabled = true; btn.textContent = '重载中…';
  toast('正在重载配置并发现模型…');
  try {
    const s = await api('/api/reload', { method: 'POST' });
    const notes = (s.discovery || []).filter(n => n && n.includes('个模型'));
    toast('已重载：' + s.providers + ' 个 provider' + (notes.length ? ' · ' + notes.join('；') : ''));
    await refresh();
  } catch (e) {
    toast('重载失败：' + e.message, true);
  } finally {
    btn.disabled = false; btn.textContent = old;
  }
}

refresh();
setInterval(refresh, 3000);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
</script>
</body>
</html>
